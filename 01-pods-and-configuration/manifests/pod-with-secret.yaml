# checkout-api-secret — Secret injected as env vars via envFrom
# Create the secret first:
#   kubectl create secret generic checkout-db-secret --from-literal=password=mysecretpass
# Apply with: kubectl apply -f pod-with-secret.yaml
apiVersion: v1
kind: Pod
metadata:
  name: checkout-api-secret
  labels:
    app: checkout
spec:
  containers:
  - name: checkout-api
    image: nginx
    envFrom:
    - secretRef:
        name: checkout-db-secret
