# service-nodeport.yaml — exposes checkout-api-deploy on a fixed port of every node.
# nodePort must be in the 30000-32767 range. Reachable at <nodeIP>:30080.
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-nodeport
spec:
  type: NodePort
  selector:
    app: checkout
    tier: backend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
